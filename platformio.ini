; Proyecto PlatformIO: el firmware se queda en la carpeta "firmware"
; Dos entornos, cada uno compila un solo sketch (ambos tienen setup/loop y no pueden ir juntos)
[platformio]
src_dir = firmware
default_envs = blink

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; upload_port = COM3   ; descomenta y ajusta si no se detecta solo

; Cada entorno compila un solo sketch. Las pruebas son .cpp (el .ino se descarta con -<*>);
; incubadora es el único que usa el .ino, así que excluye las pruebas.
[env:blink]
build_src_filter = -<*> +<prueba.cpp>

[env:pines]
build_src_filter = -<*> +<pines.cpp>

[env:incubadora]
build_src_filter = +<*> -<prueba.cpp> -<pines.cpp>
